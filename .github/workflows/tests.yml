name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (pure-logic tests, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # opencv-python needs libGL on a bare Ubuntu runner.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1

      # requirements.txt pins the CUDA 12.6 builds of torch/torchvision, which
      # are not on PyPI and are multi-GB. CI has no GPU, so install the CPU
      # builds of the same versions, then everything else from requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          grep -v -E '^(torch|torchvision)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      # Tests marked requires_data need MARIDA patches, TACO images or trained
      # artifacts, none of which are in the repository.
      - name: Run tests
        run: python -m pytest -m "not requires_data" -v --tb=short
